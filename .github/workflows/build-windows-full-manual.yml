name: Build Windows full (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-full:
    # i2d-imgui 0.8.1 hardcodes the "Visual Studio 17 2022" CMake generator.
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out Inochi Creator
        uses: actions/checkout@v4

      - name: Install LDC and DUB
        uses: dlang-community/setup-dlang@v2
        with:
          # LDC 1.42/DMD 2.112 incorrectly lowers a normal D class cast in
          # the v0_8 source tree to an Objective-C runtime operation on Windows.
          compiler: ldc-1.41.0

      - name: Activate the x64 Visual Studio build environment
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $vsDevCmd = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"

          & $env:COMSPEC /s /c "`"$vsDevCmd`" -no_logo -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)') {
                [Environment]::SetEnvironmentVariable($matches[1], $matches[2])
                "$($matches[1])=$($matches[2])" |
                  Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }

          where.exe cl
          where.exe rc
          cmake --version
          ldc2 --version
          dub --version

      - name: Clone compatible local dependencies
        shell: powershell
        run: |
          git clone --branch v0.8.1 --depth 1 --recurse-submodules `
            https://github.com/Inochi2D/i2d-imgui.git i2d-imgui
          git clone --depth 1 `
            https://github.com/Inochi2D/dcv-i2d.git dcv-i2d
          dub add-local i2d-imgui "0.8.1"
          dub add-local dcv-i2d "0.3.0"

      - name: Generate Windows resources and version metadata
        shell: powershell
        run: |
          dub build -y --config=update-version --compiler=ldc2 `
            --override-config=i2d-imgui/static_dynamicCRT
          dub build -y --config=meta --compiler=ldc2 `
            --override-config=i2d-imgui/static_dynamicCRT

      - name: Build the full Windows application
        shell: powershell
        run: |
          dub build -y --build=release --compiler=ldc2 --config=win32-full `
            --override-config=i2d-imgui/static_dynamicCRT --force

          if (-not (Test-Path "out/inochi-creator.exe")) {
            throw "The build completed without producing out/inochi-creator.exe"
          }

          $crtDirectory = Get-ChildItem `
            "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT" -Directory |
            Select-Object -First 1
          if (-not $crtDirectory) {
            throw "Could not find the x64 Visual C++ redistributable directory"
          }

          Copy-Item (Join-Path $crtDirectory.FullName "vcruntime140.dll") out
          Copy-Item (Join-Path $crtDirectory.FullName "vcruntime140_1.dll") out
          Copy-Item LICENSE out/LICENSE
          Get-ChildItem out | Format-Table Name, Length

      - name: Smoke-test application startup
        shell: powershell
        run: |
          $process = Start-Process `
            -FilePath "$env:GITHUB_WORKSPACE\out\inochi-creator.exe" `
            -WorkingDirectory "$env:GITHUB_WORKSPACE\out" `
            -PassThru

          Start-Sleep -Seconds 15
          $process.Refresh()
          if ($process.HasExited) {
            throw "Inochi Creator exited during startup with code $($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: inochi-creator-win32-full
          path: out/**
          if-no-files-found: error
          retention-days: 7
